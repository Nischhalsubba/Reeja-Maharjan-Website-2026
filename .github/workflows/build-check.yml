name: Build Check

on:
  pull_request:
  push:
    branches:
      - main
      - portfolio-priority-roadmap

permissions:
  contents: read
  statuses: write
  deployments: write

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark build check pending
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state pending --arg target_url "${RUN_URL}" --arg description 'Full repository verification is running.' --arg context 'Build Check / verify' '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate deployment configuration
        run: npm run verify:deployment

      - name: Verify production release contract
        run: npm run verify:production-contract

      - name: Verify final acceptance contracts
        run: npm run verify:final-acceptance

      - name: Verify professional facts
        run: npm run verify:facts

      - name: Verify license, contract, and content expiry
        run: npm run verify:expiry

      - name: Verify editorial governance
        run: npm run verify:editorial

      - name: Verify accessibility contract
        run: npm run verify:a11y

      - name: Verify source and style ownership
        run: npm run verify:source

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee typecheck.log

      - name: Upload type-check diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy verified main build to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=reeja-maharjan-website-2026 --branch=main --commit-hash=${{ github.sha }} --commit-message="Care Ledger release ${{ github.sha }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build check status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${JOB_STATUS}" in
            success)
              STATE=success
              DESCRIPTION='Verification, build, and production deployment passed.'
              ;;
            cancelled)
              STATE=error
              DESCRIPTION='Repository verification or deployment was cancelled.'
              ;;
            *)
              STATE=failure
              DESCRIPTION='Verification, build, or deployment failed. Open the run for diagnostics.'
              ;;
          esac

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state "${STATE}" --arg target_url "${RUN_URL}" --arg description "${DESCRIPTION}" --arg context 'Build Check / verify' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
