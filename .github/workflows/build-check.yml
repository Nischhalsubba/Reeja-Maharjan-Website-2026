name: Build Check

on:
  pull_request:
  push:
    branches:
      - main
      - portfolio-priority-roadmap

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        run: node scripts/validate-deployment-config.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify professional facts
        run: npm run verify:facts

      - name: Verify license and contract expiry
        run: npm run verify:expiry

      - name: Type check
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee typecheck.log

      - name: Upload type-check diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
