name: Cloudflare Account Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-account-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit Cloudflare routing configuration
        id: audit
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_HOSTNAME: reejamaharjan.com.np
          CLOUDFLARE_PAGES_PROJECT: reeja-maharjan-website-2026
          CLOUDFLARE_AUDIT_REPORT: cloudflare-account-audit.json
        run: node scripts/audit-cloudflare-account.mjs
      - name: Upload account audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-account-audit
          path: site/cloudflare-account-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when routing conflicts remain
        if: steps.audit.outcome != 'success'
        run: exit 1
