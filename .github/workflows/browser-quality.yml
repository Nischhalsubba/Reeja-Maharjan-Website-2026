name: Browser Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      origin:
        description: Optional deployed origin
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4321/ > /dev/null && exit 0; sleep 1; done
          cat preview.log
          exit 1
      - name: Run browser quality checks
        env:
          BROWSER_TEST_ORIGIN: ${{ inputs.origin || 'http://127.0.0.1:4321' }}
        run: npx playwright test tests/browser --reporter=line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-quality-evidence-${{ github.sha }}
          path: |
            site/preview.log
            site/test-results/
          if-no-files-found: warn
          retention-days: 30
