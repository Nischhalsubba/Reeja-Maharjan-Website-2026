name: Browser Quality

on:
  pull_request:
  workflow_dispatch:
    inputs:
      origin:
        description: Optional deployed origin, such as a Cloudflare Pages preview URL
        required: false
        type: string

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Run browser quality checks
        env:
          BROWSER_TEST_ORIGIN: ${{ inputs.origin || 'http://127.0.0.1:4321' }}
        run: npx playwright test tests/browser --reporter=line

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-log
          path: preview.log
          if-no-files-found: warn
          retention-days: 7
