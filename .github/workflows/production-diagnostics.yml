name: Production Diagnostics

on:
  workflow_dispatch:
    inputs:
      pages_origin:
        description: Optional Cloudflare Pages preview origin
        required: false
        type: string
  schedule:
    - cron: '47 2 * * *'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run production diagnostics
        env:
          SITE_ORIGIN: https://reejamaharjan.com.np
          PAGES_ORIGIN: ${{ inputs.pages_origin }}
          EXPECTED_COMMIT: ${{ github.sha }}
          DIAGNOSTICS_REPORT: production-diagnostics.json
        run: node scripts/diagnose-production.mjs
      - name: Upload diagnostics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-diagnostics
          path: site/production-diagnostics.json
          if-no-files-found: error
          retention-days: 14
