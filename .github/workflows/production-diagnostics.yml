name: Production Diagnostics

on:
  workflow_dispatch:
    inputs:
      pages_origin:
        description: Optional Cloudflare Pages preview origin
        required: false
        type: string
  schedule:
    - cron: '47 2 * * *'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run production diagnostics
        env:
          SITE_ORIGIN: https://reejamaharjan.com.np
          PAGES_ORIGIN: ${{ inputs.pages_origin }}
          EXPECTED_COMMIT: ${{ github.sha }}
          DIAGNOSTICS_REPORT: production-diagnostics.json
        run: node scripts/diagnose-production.mjs
      - name: Upload diagnostics report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-diagnostics
          path: site/production-diagnostics.json
          if-no-files-found: error
          retention-days: 14
