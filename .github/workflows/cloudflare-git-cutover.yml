name: Cloudflare Git Cutover

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-git-cutover
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate one-time cutover script
        run: bash -n scripts/cloudflare-git-cutover.sh

      - name: Mark Cloudflare cutover pending
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state pending --arg target_url "${RUN_URL}" --arg description 'Cloudflare Git-native production cutover is running.' --arg context 'Cloudflare Cutover' '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Authorize Cloudflare and perform rollback-safe Git cutover
        id: cutover
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_PROJECT: reeja-maharjan-website-2026
          NEW_PROJECT: reeja-maharjan-website-2026-git
          REPO_OWNER: Nischhalsubba
          REPO_OWNER_ID: '29011681'
          REPO_ID: '1162405518'
          REPO_NAME: Reeja-Maharjan-Website-2026
          PRODUCTION_DOMAIN: reejamaharjan.com.np
        run: bash scripts/cloudflare-git-cutover.sh

      - name: Upload cutover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b5e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-git-cutover-evidence
          path: |
            site/cloudflare-git-cutover-report.json
            site/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Cloudflare cutover status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOVER_OUTCOME: ${{ steps.cutover.outcome }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${CUTOVER_OUTCOME}" = 'success' ]; then
            STATE=success
            DESCRIPTION='Cloudflare Git-native production cutover passed.'
          else
            STATE=failure
            DESCRIPTION='Cloudflare Git-native production cutover failed.'
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state "$STATE" --arg target_url "${RUN_URL}" --arg description "$DESCRIPTION" --arg context 'Cloudflare Cutover' '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Fail when cutover did not complete
        if: steps.cutover.outcome != 'success'
        run: exit 1
