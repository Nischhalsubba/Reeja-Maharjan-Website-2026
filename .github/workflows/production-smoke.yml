name: Production Smoke

on:
  workflow_run:
    workflows: [Build Check]
    types: [completed]
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed origin to verify
        required: false
        default: https://reejamaharjan.com.np
        type: string
      expected_commit:
        description: Optional commit SHA expected in /build.json
        required: false
        type: string
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-verification-main
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve deployed origin and expected commit
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            origin="https://reejamaharjan.com.np"
            sha="${{ github.event.workflow_run.head_sha }}"
            checkout="$sha"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            origin="${{ inputs.origin }}"
            sha="${{ inputs.expected_commit }}"
            checkout="main"
          else
            origin="https://reejamaharjan.com.np"
            checkout="main"
            sha="${{ github.sha }}"
          fi

          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "checkout=$checkout" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release source
        if: steps.target.outputs.checkout != 'main'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.checkout }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install application dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Verify deployed domain and commit
        id: smoke_check
        working-directory: site
        env:
          SITE_ORIGIN: ${{ steps.target.outputs.origin }}
          EXPECTED_COMMIT: ${{ steps.target.outputs.sha }}
          SMOKE_ATTEMPTS: '40'
          SMOKE_DELAY_MS: '30000'
          PRODUCTION_REPORT: production-smoke-report.json
        run: node scripts/smoke-production.mjs
      - name: Install browser test runner
        if: steps.smoke_check.outcome == 'success'
        working-directory: site
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Run live browser quality suite
        if: steps.smoke_check.outcome == 'success'
        working-directory: site
        env:
          BROWSER_TEST_ORIGIN: ${{ steps.target.outputs.origin }}
        run: npx playwright test tests/browser --reporter=line
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-production-evidence-${{ steps.target.outputs.sha || github.run_id }}
          path: |
            site/production-smoke-report.json
            site/test-results/
          if-no-files-found: warn
          retention-days: 30
