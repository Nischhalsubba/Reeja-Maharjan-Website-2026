name: Production Smoke

on:
  workflow_run:
    workflows:
      - Build Check
    types:
      - completed
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed origin to verify
        required: false
        default: https://reejamaharjan.com.np
        type: string
      expected_commit:
        description: Optional commit SHA expected in /build.json
        required: false
        type: string
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-verification-main
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve deployed origin and expected commit
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "origin=https://reejamaharjan.com.np" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "checkout=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "origin=${{ inputs.origin }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.expected_commit }}" >> "$GITHUB_OUTPUT"
            echo "checkout=main" >> "$GITHUB_OUTPUT"
          else
            echo "origin=https://reejamaharjan.com.np" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "checkout=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark production smoke pending
        if: steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state pending --arg target_url "${RUN_URL}" --arg description 'Cloudflare deployment and live browser checks are running.' --arg context 'Production Smoke / live' '{state:$state,target_url:$target_url,description:$description,context:$context}')"

      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify deployed domain and commit
        id: smoke_check
        env:
          SITE_ORIGIN: ${{ steps.target.outputs.origin }}
          EXPECTED_COMMIT: ${{ steps.target.outputs.sha }}
          SMOKE_ATTEMPTS: '40'
          SMOKE_DELAY_MS: '30000'
          PRODUCTION_REPORT: production-smoke-report.json
        run: node scripts/smoke-production.mjs

      - name: Install browser test runner
        if: steps.smoke_check.outcome == 'success'
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.62.1
          npx playwright install --with-deps chromium

      - name: Run live browser quality suite
        if: steps.smoke_check.outcome == 'success'
        id: browser_check
        env:
          BROWSER_TEST_ORIGIN: ${{ steps.target.outputs.origin }}
        run: npx playwright test tests/browser --reporter=line

      - name: Write release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloudflare production verification"
            echo ""
            echo "- Origin: \`${{ steps.target.outputs.origin }}\`"
            echo "- Expected commit: \`${{ steps.target.outputs.sha || 'not specified' }}\`"
            echo "- Smoke result: \`${{ steps.smoke_check.outcome }}\`"
            echo "- Browser result: \`${{ steps.browser_check.outcome || 'not run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-evidence-${{ steps.target.outputs.sha || github.run_id }}
          path: |
            production-smoke-report.json
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish production smoke status
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${JOB_STATUS}" in
            success)
              STATE=success
              DESCRIPTION='Cloudflare deployment and live browser checks passed.'
              ;;
            cancelled)
              STATE=error
              DESCRIPTION='Production smoke verification was cancelled.'
              ;;
            *)
              STATE=failure
              DESCRIPTION='Production smoke verification failed. Open the run for diagnostics.'
              ;;
          esac

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}" \
            --data "$(jq -nc --arg state "${STATE}" --arg target_url "${RUN_URL}" --arg description "${DESCRIPTION}" --arg context 'Production Smoke / live' '{state:$state,target_url:$target_url,description:$description,context:$context}')"
