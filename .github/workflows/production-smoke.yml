name: Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production domain
        env:
          SITE_ORIGIN: https://reejamaharjan.com.np
        run: node scripts/smoke-production.mjs
