name: Production Smoke

on:
  workflow_run:
    workflows:
      - Build Check
    types:
      - completed
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed origin to verify
        required: false
        default: https://reejamaharjan.com.np
        type: string
      expected_commit:
        description: Optional commit SHA expected in /build.json
        required: false
        type: string
  schedule:
    - cron: '17 2 * * *'

jobs:
  smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve deployed origin and expected commit
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "origin=https://reejamaharjan.com.np" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "origin=${{ inputs.origin }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.expected_commit }}" >> "$GITHUB_OUTPUT"
          else
            echo "origin=https://reejamaharjan.com.np" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify deployed domain and commit
        env:
          SITE_ORIGIN: ${{ steps.target.outputs.origin }}
          EXPECTED_COMMIT: ${{ steps.target.outputs.sha }}
          SMOKE_ATTEMPTS: '20'
          SMOKE_DELAY_MS: '30000'
        run: node scripts/smoke-production.mjs
