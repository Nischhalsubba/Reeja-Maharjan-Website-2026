name: Safe Dependency Refresh

on:
  push:
    branches: [main]
    paths: ['.github/workflows/security-lock-refresh.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply nonbreaking npm fixes only
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --no-fund > npm-fix-output.txt 2>&1
          exitcode=$?
          set -e
          echo "npm audit fix exit $exitcode (remaining issues tracked separately)"
          tail -60 npm-fix-output.txt
      - name: Inspect dependency patch
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git diff -- package.json package-lock.json > security-lock-refresh.patch
          if test -s security-lock-refresh.patch; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reinstall updated lockfile
        if: steps.changed.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
      - name: Verify current design and source/build contracts
        if: steps.changed.outputs.changed == 'true'
        run: npm run verify
      - name: Record remaining advisories
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        run: |
          npm audit --json > npm-audit-after.json || true
          test -s npm-audit-after.json
      - name: Push reviewed candidate to a separate branch
        if: steps.changed.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="security/npm-audit-safe-$RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add package.json package-lock.json
          git commit -m "chore(security): nonbreaking npm audit dependency remediation"
          git push origin "HEAD:refs/heads/$branch"
          echo "Candidate branch: $branch"
      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-lock-refresh-${{ github.run_id }}
          path: |
            site/security-lock-refresh.patch
            site/npm-fix-output.txt
            site/npm-audit-after.json
          if-no-files-found: warn
          retention-days: 14
