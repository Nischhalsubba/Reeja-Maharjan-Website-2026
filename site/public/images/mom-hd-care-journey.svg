 <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1C2C3A" flood-opacity=".12"/></filter>
 <pattern id="grid" width="65" height="65" patternUnits="userSpaceOnUse"><path d="M65 0H0V65" fill="none" stroke="#2F7368" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#background)"/>
<rect width="1600" height="900" fill="url(#grid)"/>
