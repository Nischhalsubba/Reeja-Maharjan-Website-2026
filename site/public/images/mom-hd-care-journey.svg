<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Maternal health research: monitoring and follow-up</title>
<desc id="desc">Purpose-built editorial illustration of a blood pressure monitor, glucose meter, and a connected follow-up pathway. No actual patient readings or study outcomes are shown.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EFF8F5"/><stop offset=".58" stop-color="#DFEFE9"/><stop offset="1" stop-color="#C6E5DC"/></linearGradient>
